:root {
  --field: oklch(15.1% 0.025 267); --surface: oklch(20% 0.04 267.5); --surface-raised: oklch(24.9% 0.049 268); --surface-high: oklch(29.9% 0.057 268); --rule: oklch(32.1% 0.055 266);
  --ink: oklch(97.2% 0.007 261); --ink-muted: oklch(75.1% 0.039 267); --ink-dim: oklch(66.6% 0.048 268); --live: oklch(89.6% 0.199 122); --on-live: oklch(18% 0.032 267);
  --figure: 'Barlow Condensed', 'Arial Narrow', sans-serif; --text: 'Barlow', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { display: grid; place-items: center; background: oklch(10% 0.02 267); font-family: var(--text); overflow: hidden; }
.og { position: relative; width: 1200px; height: 630px; overflow: hidden; flex: none; background: var(--field); color: var(--ink); font-variant-numeric: tabular-nums lining-nums; }
.mark { display: block; fill: none; stroke-linecap: round; stroke-width: 2; }
.mark .frame { stroke: currentColor; } .mark .lit { stroke: var(--live); stroke-width: 2.4; }
.wordmark { display: inline-flex; align-items: center; font-weight: 700; color: var(--ink); }
.caption { position: fixed; left: 16px; right: 16px; bottom: 12px; color: var(--ink-muted); font: 700 13px/1.4 var(--text); }
.caption a { color: var(--ink); text-underline-offset: 3px; }
.caption a:hover { color: var(--live); }
</style><style>
.head { position: absolute; left: 48px; right: 48px; top: 36px; display: flex; align-items: center; justify-content: space-between; }
.head .wordmark { gap: 14px; font-size: 38px; }
.head .clock { font: 700 44px/1 var(--figure); color: var(--ink-muted); }
.grid { position: absolute; left: 48px; right: 48px; top: 116px; bottom: 44px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 16px; }
.tile { background: var(--surface); border-radius: 22px; padding: 18px 22px 16px; display: grid; grid-template-rows: auto 1fr 1fr auto; }
.chip { justify-self: start; min-width: 44px; padding: 4px 10px 2px; border-radius: 9px; background: var(--surface-raised); font: 700 30px/1 var(--figure); text-align: center; }
.row { display: grid; grid-template-columns: 22px 52px 1fr; align-items: center; gap: 12px; }
.row .serve { width: 0; height: 0; border-style: solid; border-width: 10px 0 10px 14px; border-color: transparent; }
.row .serve.on { border-left-color: var(--live); }
.row .games { height: 46px; display: grid; place-items: center; border-radius: 9px; background: var(--surface-raised); font: 600 32px/1 var(--figure); }
.row .points { justify-self: end; font: 700 82px/0.86 var(--figure); letter-spacing: -0.01em; }
.row .points.hot { color: var(--live); }
.foot { font: 600 20px/1 var(--figure); color: var(--ink-dim); min-height: 20px; }
</style></head><body>
